<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="440" viewBox="0 0 1440 440" role="img" aria-labelledby="title description">
  <title id="title">TV Kumanda</title>
  <desc id="description">A remote control routes eligible Android TV keys to apps and Android media volume.</desc>
  <defs>
    <linearGradient id="backdrop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101A19"/>
      <stop offset=".58" stop-color="#142622"/>
      <stop offset="1" stop-color="#1C392F"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#A9F2C2"/>
      <stop offset="1" stop-color="#63D7A5"/>
    </linearGradient>
    <linearGradient id="remote" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F8F3E8"/>
      <stop offset="1" stop-color="#D4E5D8"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#D8F3DF" stroke-opacity=".055"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12"/>
      <feOffset dy="12"/>
      <feComponentTransfer><feFuncA type="linear" slope=".28"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1440" height="440" rx="28" fill="url(#backdrop)"/>
  <rect width="1440" height="440" rx="28" fill="url(#grid)"/>
  <circle cx="1300" cy="50" r="220" fill="#70E0A7" opacity=".07"/>
  <circle cx="770" cy="440" r="270" fill="#F2B872" opacity=".055"/>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <rect x="78" y="62" width="242" height="38" rx="19" fill="#203B32" stroke="#75DCA7" stroke-opacity=".38"/>
    <circle cx="101" cy="81" r="5" fill="#83E6AE"/>
    <text x="118" y="87" fill="#BDECCB" font-size="14" font-weight="700" letter-spacing="2">ANDROID TV · TV BOX</text>

    <text x="78" y="178" fill="#F7F5EB" font-size="58" font-weight="750" letter-spacing="-2">TV Kumanda</text>
    <text x="80" y="226" fill="#B5D9C5" font-size="23" font-weight="500">Kumandanı kendine göre ayarla.</text>
    <text x="80" y="260" fill="#B5D9C5" font-size="20" font-weight="400">Make your remote work for you.</text>

    <g transform="translate(80 310)">
      <rect width="220" height="42" rx="21" fill="#253F34"/>
      <path d="M20 21h23m-8-8 8 8-8 8" fill="none" stroke="#93E8B4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="56" y="27" fill="#E8F4E9" font-size="14" font-weight="650">KEYS + MEDIA VOLUME</text>
    </g>
    <text x="80" y="394" fill="#8CAC9A" font-size="13" letter-spacing=".6">LOCAL-FIRST  ·  NO PHONE-TO-TV CONTROL</text>
  </g>

  <g filter="url(#shadow)" transform="translate(846 64)">
    <rect x="0" y="42" width="342" height="220" rx="22" fill="#20322E" stroke="#84D9A5" stroke-opacity=".45" stroke-width="2"/>
    <rect x="18" y="60" width="306" height="178" rx="12" fill="#111B19"/>
    <rect x="39" y="82" width="264" height="134" rx="10" fill="url(#screen)"/>
    <path d="M74 185V142l34-24 34 24v43h-25v-27H99v27z" fill="#173329"/>
    <rect x="162" y="113" width="109" height="14" rx="7" fill="#1C4635" opacity=".9"/>
    <rect x="162" y="139" width="83" height="10" rx="5" fill="#2B7351" opacity=".6"/>
    <rect x="162" y="160" width="96" height="10" rx="5" fill="#2B7351" opacity=".38"/>
    <path d="M135 279h72l17 20H118z" fill="#3C554C"/>
    <rect x="100" y="298" width="142" height="9" rx="4.5" fill="#4B655A"/>
    <text x="42" y="327" fill="#A3C6B0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">YOUR TV. YOUR SHORTCUTS.</text>
  </g>

  <g transform="translate(1210 70) rotate(8 72 145)" filter="url(#shadow)">
    <rect x="7" y="0" width="126" height="284" rx="34" fill="url(#remote)" stroke="#FFFFFF" stroke-opacity=".75" stroke-width="2"/>
    <rect x="25" y="20" width="90" height="8" rx="4" fill="#A6B7AA"/>
    <circle cx="70" cy="64" r="20" fill="#17352C"/>
    <circle cx="70" cy="64" r="8" fill="#83E1AA"/>
    <circle cx="70" cy="116" r="13" fill="#CEE3D2"/>
    <circle cx="70" cy="116" r="5" fill="#557263"/>
    <rect x="34" y="151" width="22" height="22" rx="8" fill="#B7D7C2"/>
    <rect x="84" y="151" width="22" height="22" rx="8" fill="#B7D7C2"/>
    <rect x="34" y="184" width="22" height="22" rx="8" fill="#B7D7C2"/>
    <rect x="84" y="184" width="22" height="22" rx="8" fill="#B7D7C2"/>
    <path d="M61 164h18M70 155v18" stroke="#426253" stroke-width="2" stroke-linecap="round"/>
    <path d="M62 227h16M70 219v16" stroke="#426253" stroke-width="3" stroke-linecap="round"/>
    <path d="M44 255c6-7 12-7 18 0m18 0c6-7 12-7 18 0" fill="none" stroke="#4F8D69" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <g fill="none" stroke="#8EE5AF" stroke-linecap="round">
    <path d="M772 184h53" stroke-width="3" stroke-dasharray="6 8"/>
    <path d="m813 174 12 10-12 10" stroke-width="3" stroke-linejoin="round"/>
  </g>
  <g fill="#A4E9B8">
    <circle cx="762" cy="184" r="4"/>
    <circle cx="748" cy="184" r="2" opacity=".65"/>
  </g>
</svg>
